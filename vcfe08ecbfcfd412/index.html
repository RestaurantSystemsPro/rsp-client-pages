<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vivio's Warren · Owner Status</title>
<style>
  :root{
    --surface-1:#fcfcfb; --page:#f9f9f7;
    --ink-1:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
    --grid:#e1e0d9; --baseline:#c3c2b7; --ring:rgba(11,11,11,.10);
    --s1:#2a78d6; --s2:#1baf7a; --s3:#eda100;
    --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --critical:#d03b3b;
    --good-wash:rgba(12,163,12,.12); --serious-wash:rgba(236,131,90,.16); --critical-wash:rgba(208,59,59,.14);
    --info-wash:rgba(42,120,214,.12);
    --delta-good:#006300;
  }
    @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --surface-1:#1a1a19; --page:#0d0d0d;
      --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
      --grid:#2c2c2a; --baseline:#383835; --ring:rgba(255,255,255,.10);
      --s1:#3987e5; --s2:#199e70; --s3:#c98500;
      --delta-good:#0ca30c;
    }
  }
  :root[data-theme="dark"]{
      --surface-1:#1a1a19; --page:#0d0d0d;
      --ink-1:#ffffff; --ink-2:#c3c2b7; --ink-3:#898781;
      --grid:#2c2c2a; --baseline:#383835; --ring:rgba(255,255,255,.10);
      --s1:#3987e5; --s2:#199e70; --s3:#c98500;
      --delta-good:#0ca30c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--page);color:var(--ink-1);padding:20px;line-height:1.4}
  .wrap{max-width:1080px;margin:0 auto}
  header{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:6px}
  h1{font-size:22px;font-weight:650}
  .asof{color:var(--ink-3);font-size:13px}
  .subtitle{color:var(--ink-2);font-size:13px;margin-bottom:18px}
  .card{background:var(--surface-1);border:1px solid var(--ring);border-radius:12px;padding:16px 18px;margin-bottom:16px}
  h2{font-size:13px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.04em;margin-bottom:12px}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
  .tile{background:var(--surface-1);border:1px solid var(--ring);border-radius:12px;padding:14px 16px}
  .tile .label{font-size:12px;color:var(--ink-2)}
  .tile .value{font-size:26px;font-weight:600;margin:2px 0}
  .tile .delta{font-size:12px;color:var(--ink-2)}
  .delta.up{color:var(--delta-good);font-weight:600}
  .delta.down{color:var(--critical);font-weight:600}
  .hero .value{font-size:44px}
  .statusline{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
  .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
  .flag{display:flex;gap:10px;padding:9px 10px;border-radius:8px;margin-bottom:8px;font-size:13.5px;align-items:flex-start}
  .flag:last-child{margin-bottom:0}
  .flag .sev{flex:0 0 auto;font-size:11px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:10px;color:#fff;margin-top:1px;white-space:nowrap}
  .flag.crit{background:var(--critical-wash)} .flag.crit .sev{background:var(--critical)}
  .flag.high{background:var(--critical-wash)} .flag.high .sev{background:var(--critical)}
  .flag.med{background:var(--serious-wash)} .flag.med .sev{background:var(--serious);color:#fff}
  .flag.sys{background:var(--info-wash)} .flag.sys .sev{background:var(--s1)}
  .flag.note{background:rgba(137,135,129,.10)} .flag.note .sev{background:var(--ink-3)}
  .flag b{font-weight:650}
  .legend{display:flex;gap:18px;font-size:12.5px;color:var(--ink-2);margin-bottom:8px;flex-wrap:wrap}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .key{width:12px;height:12px;border-radius:3px;display:inline-block}
  .key.line{height:3px;border-radius:2px;width:16px}
  svg text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
  .tooltip{position:fixed;pointer-events:none;background:var(--surface-1);border:1px solid var(--ring);box-shadow:0 4px 14px rgba(0,0,0,.18);border-radius:8px;padding:8px 11px;font-size:12.5px;color:var(--ink-1);opacity:0;transition:opacity .1s;z-index:10;max-width:240px}
  .tooltip .t-day{font-weight:650;margin-bottom:3px}
  .tooltip .t-row{display:flex;justify-content:space-between;gap:14px;color:var(--ink-2)}
  .tooltip .t-row b{color:var(--ink-1);font-variant-numeric:tabular-nums}
